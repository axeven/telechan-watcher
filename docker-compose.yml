services:
  watcher:
    build: .
    image: telechan-watcher
    container_name: telechan-watcher
    command: python watch.py
    env_file: .env
    volumes:
      - .:/app
    restart: unless-stopped

  web:
    build: .
    image: telechan-watcher
    container_name: telechan-web
    command: python app.py
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
